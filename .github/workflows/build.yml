name: Build Record

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Android arm64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64

      - name: Upload Record
        uses: actions/upload-artifact@v7
        with:
          name: Record-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
